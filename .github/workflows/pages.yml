name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # Publish the real graph only if site/movies.json was committed on purpose; otherwise the sample.
          if [ -f site/movies.json ]; then src=site/movies.json; else src=graph/sample_movies.json; fi
          python graph/build_graph.py "$src" _site/graph.html
          rm -f _site/movies.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
